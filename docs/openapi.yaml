        '400':
          $ref: './schemas/responses.yml#/components/responses/BadRequest'
        '404':
          $ref: './schemas/responses.yml#/components/responses/NotFound'
        '500':
          $ref: './schemas/responses.yml#/components/responses/InternalServerError'
          
  /currency/{metagraph_id}/snapshots/{hash_or_ordinal}:
    get:
      tags: 
        - Snapshots
      summary: Get metagraph snapshot by hash, ordinal, or 'latest'
      description: Retrieve a specific metagraph snapshot by its hash, ordinal, or 'latest' keyword for the most recent snapshot
      operationId: getCurrencySnapshot
      parameters:
        - name: metagraph_id
