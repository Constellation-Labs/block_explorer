openapi: 3.0.3
info:
  title: Constellation Block Explorer API
  description: API for exploring the Constellation chain data on both the Hypergraph and Metagraphs
  version: 4.0.0
servers:
  - url: https://be-mainnet.constellationnetwork.io
    description: MainNet
  - url: https://be-integrationnet.constellationnetwork.io
    description: IntegrationNet 

# Resource-based tag organization
tags:
  - name: Metagraphs
    description: Metagraph registry and information
  - name: Account Information
    description: Balances and address-related data
  - name: Snapshots
    description: Global and metagraph snapshots
  - name: Blocks
    description: Block information
  - name: Transactions
    description: Standard and fee transactions
  - name: Token Operations
    description: Token locks, delegated spending, and related operations
  - name: Actions
    description: Combined operations view

x-tagGroups:
  - name: "Network Identity"
    tags:
      - Metagraphs
      - Account Information
  - name: "Blockchain State"
    tags:
      - Snapshots
      - Blocks
      - Transactions
  - name: "Token Actions"
    tags:
      - Token Operations
      - Actions
      

paths:
  # ==================== SNAPSHOTS ====================
  /global-snapshots:
    get:
      tags: 
        - Snapshots
      summary: Get all global snapshots
      description: Retrieve a paginated list of global snapshots
      operationId: getGlobalSnapshots
      parameters:
        - $ref: './schemas/params.yml#/components/parameters/limitParam'
        - $ref: './schemas/params.yml#/components/parameters/nextParam'
        - $ref: './schemas/params.yml#/components/parameters/searchAfterParam'
        - $ref: './schemas/params.yml#/components/parameters/searchBeforeParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: './schemas/dag.yml#/components/schemas/PaginatedGlobalSnapshots'
        '400':
          $ref: './schemas/responses.yml#/components/responses/BadRequest'
        '500':
          $ref: './schemas/responses.yml#/components/responses/InternalServerError'
  
  /global-snapshots/{hash_or_ordinal}:
    get:
      tags: 
        - Snapshots
      summary: Get global snapshot by hash, ordinal, or 'latest'
      description: Retrieve a specific global snapshot by its hash, ordinal, or 'latest' keyword for the most recent snapshot
      operationId: getGlobalSnapshot
      parameters:
        - name: hash_or_ordinal
          in: path
          description: Hash, ordinal, or 'latest' to identify the global snapshot
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: './schemas/dag.yml#/components/schemas/GlobalSnapshotResponse'
        '404':
          $ref: './schemas/responses.yml#/components/responses/NotFound'
        '500':
          $ref: './schemas/responses.yml#/components/responses/InternalServerError'

  /addresses/{address}/snapshots:
    get:
      tags: 
        - Snapshots
      summary: Get metagraph snapshots by owner address
      description: Retrieve metagraph snapshots associated with a specific owner address
      operationId: currencySnapshotsByOwnerAddress
      parameters:
        - name: address
          in: path
          description: Owner address to filter snapshots
          required: true
          schema:
            type: string
        - $ref: './schemas/params.yml#/components/parameters/limitParam'
        - $ref: './schemas/params.yml#/components/parameters/nextParam'
        - $ref: './schemas/params.yml#/components/parameters/searchAfterParam'
        - $ref: './schemas/params.yml#/components/parameters/searchBeforeParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: './schemas/metagraph.yml#/components/schemas/PaginatedMetagraphSnapshots'
        '400':
          $ref: './schemas/responses.yml#/components/responses/BadRequest'
        '404':
          $ref: './schemas/responses.yml#/components/responses/NotFound'
        '500':
          $ref: './schemas/responses.yml#/components/responses/InternalServerError'

  /currency/{metagraph_id}/snapshots:
    get:
      tags: 
        - Snapshots
      summary: Get all snapshots for a metagraph
      description: Retrieve a paginated list of snapshots for a specific metagraph
      operationId: getCurrencySnapshots
      parameters:
        - name: metagraph_id
          in: path
          description: Identifier for the metagraph
          required: true
