globalSnapshots:
  handler: src/handlers/dagHandler.globalSnapshots
  events:
    - httpApi:
        path: /global-snapshots
        method: GET
globalSnapshot:
  handler: src/handlers/dagHandler.globalSnapshot
  events:
    - httpApi:
        path: /global-snapshots/{term}
        method: GET
globalSnapshotRewards:
  handler: src/handlers/dagHandler.globalSnapshotRewards
  events:
    - httpApi:
        path: /global-snapshots/{term}/rewards
        method: GET
globalSnapshotTransactions:
  handler: src/handlers/dagHandler.globalSnapshotTransactions
  events:
    - httpApi:
        path: /global-snapshots/{term}/transactions
        method: GET
block:
  handler: src/handlers/dagHandler.dagBlock
  events:
    - httpApi:
        path: /blocks/{hash}
        method: GET
transactions:
  handler: src/handlers/dagHandler.dagTransactions
  events:
    - httpApi:
        path: /transactions
        method: GET
transaction:
  handler: src/handlers/dagHandler.dagTransaction
  events:
    - httpApi:
        path: /transactions/{hash}
        method: GET
transactionsByAddress:
  handler: src/handlers/dagHandler.dagTransactionsByAddress
  events:
    - httpApi:
        path: /addresses/{address}/transactions
        method: GET
transactionsBySource:
  handler: src/handlers/dagHandler.dagTransactionsBySource
  events:
    - httpApi:
        path: /addresses/{address}/transactions/sent
        method: GET
transactionsByDestination:
  handler: src/handlers/dagHandler.dagTransactionsByDestination
  events:
    - httpApi:
        path: /addresses/{address}/transactions/received
        method: GET
balanceByAddress:
  handler: src/handlers/dagHandler.dagBalanceByAddress
  events:
    - httpApi:
        path: /addresses/{address}/balance
        method: GET
