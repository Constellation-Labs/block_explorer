on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: environment
        required: true

name: Deploy postgress app

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }}
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run test:tsc

      - name: Create env file
        run: |
          cat > env.yml << EOF
          ${{ secrets.API_ENV_POSTGRES }}
          EOF

      # The role comes from terraform/ and trusts only jobs in this environment.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Serverless deploy
        run: npx --yes serverless@3.40.0 deploy --stage ${{ inputs.environment }} --region us-west-1

      # Serverless 3 cannot declare Lambda log levels, and a deploy can reset
      # them. Keep every function at JSON logs, WARN level.
      - name: Keep Lambda logs at WARN
        run: |
          for f in $(aws lambda list-functions --query "Functions[?starts_with(FunctionName, 'api-${{ inputs.environment }}-')].FunctionName" --output text); do
            aws lambda update-function-configuration --function-name "$f" \
              --logging-config LogFormat=JSON,ApplicationLogLevel=WARN,SystemLogLevel=WARN > /dev/null
            aws lambda wait function-updated-v2 --function-name "$f"
          done
